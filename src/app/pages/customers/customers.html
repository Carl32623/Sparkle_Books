<div class="customers-page">
    <!-- Customers Page -->
    <section class="customers-header">
        <div>
            <h1>Customers</h1>
            <p>Manage your customer information and cleaning history.</p>
        </div>

        <button class="add-customer-button">
            + Add Customer
        </button>
    </section>
    <!-- Customers Content -->
    <section class="customer-content">
        <!-- Customer Toolbar -->
        <div class="customer-toolbar">
            <input
                type="text"
                class="customer-search"
                placeholder="Search customers..."
            >
        </div>
        <!-- Customer Table -->
        <div class="customer-table">
            <div class="customer-table-header">
                <span>Name</span>
                <span>Phone</span>
                <span>Email</span>
                <span>Jobs</span>
                <span>Action</span>
            </div>

            <div class="customer-row">
                <span>John Smith</span>
                <span>555-123-4567</span>
                <span>john@email.com</span>
                <span>12</span>
                <span>
                    <button class="table-action">View</button>
                </span>
            </div>

            <div class="customer-row">
                <span>Robert Williams</span>
                <span>555-555-1234</span>
                <span>robert@email.com</span>
                <span>4</span>
                <span>
                    <button class="table-action">View</button>
                </span>
            </div>

            <div class="customer-row">
                <span>Sarah Johnson</span>
                <span>555-987-6543</span>
                <span>sarah@email.com</span>
                <span>8</span>
                <span>
                    <button class="table-action">View</button>
                </span>
            </div>
        </div>
    </section>
</div>
